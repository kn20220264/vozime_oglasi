version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vozime_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vozime_oglasi
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: vozime_user
      MYSQL_PASSWORD: vozime_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vozime_network

  redis:
    image: redis:alpine
    container_name: vozime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - vozime_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vozime_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_DATABASE=vozime_oglasi
      - DB_USERNAME=vozime_user
      - DB_PASSWORD=vozime_pass
      - REDIS_HOST=redis
    networks:
      - vozime_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vozime_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - vozime_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vozime_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: vozime_user
      PMA_PASSWORD: vozime_pass
    depends_on:
      - db
    networks:
      - vozime_network

networks:
  vozime_network:
    driver: bridge

volumes:
  db_data: